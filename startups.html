<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Startups — Zichao Yu</title>
    <meta
      name="description"
      content="Auto-updated tracker of AI startups and product lines in China and the United States."

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="assets/img/favicon.svg?v=20261007" type="image/svg+xml" />

  <body>
    <main class="page">
      <a class="back" href="./">← Zichao Yu</a>

      <header class="page-head">
        <h1 class="page-title">AI Startups</h1>
        <p class="page-meta">
          China and United States<span id="updated"></span>
        </p>
      </header>

      <p class="lead">
        Daily crawl of public catalogs and news: notable labs, recent YC AI
        companies, and newly launched products. Not investment advice.
      </p>

      <div class="toolbar">
        <label class="visually-hidden" for="q">Search companies</label>
        <input
          class="search"
          id="q"
          type="search"
          placeholder="Search company, product, tag…"
          autocomplete="off"
        />
        <div class="filters" role="group" aria-label="Country">
          <button type="button" data-country="all" aria-pressed="true">
            All<span class="n" data-count="all"></span>
          </button>
          <button type="button" data-country="CN" aria-pressed="false">
            China<span class="n" data-count="CN"></span>
          </button>
          <button type="button" data-country="US" aria-pressed="false">
            United States<span class="n" data-count="US"></span>
          </button>
        </div>
      </div>

      <section class="section" aria-labelledby="companies-heading">
        <h2 id="companies-heading">
          Companies<span class="count" id="company-count"></span>
        </h2>
        <p class="muted" id="companies-empty">Loading…</p>
        <ol class="list" id="companies"></ol>
      </section>

      <section class="section" aria-labelledby="launches-heading">
        <h2 id="launches-heading">
          Recent launches<span class="count" id="launch-count"></span>
        </h2>
        <p class="muted" id="launches-empty" hidden>No matches.</p>
        <ol class="list" id="launches"></ol>
      </section>

      <footer class="footer">&copy; <span id="year">2026</span> Zichao Yu</footer>
