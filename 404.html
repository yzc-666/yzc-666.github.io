<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Zichao Yu</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#04060a" />

    <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />

    <style>
      .lost {
        min-height: 100vh;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 0.5rem;
        padding: 2rem;
      }
      .lost__code {
        font-size: clamp(5rem, 22vw, 12rem);
        line-height: 1;
        letter-spacing: 0.08em;
      }
      .lost__msg {
        color: var(--text-dim);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-size: 0.8rem;
      }
      .lost .btn {
        margin-top: 2rem;
        justify-self: center;
      }
    </style>
  </head>

  <body>
    <div class="fx-grid" aria-hidden="true"></div>
    <div class="fx-glow" aria-hidden="true"></div>
    <div class="fx-scanlines" aria-hidden="true"></div>

    <main class="lost">
      <h1 class="glitch lost__code" data-text="404">404</h1>
      <p class="lost__msg">Signal lost — no such page</p>
      <a class="btn btn--primary" href="/">Return to base</a>
    </main>
  </body>
</html>
